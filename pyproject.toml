[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-nlp-from-scratch"
version = "0.1.0"
description = "Three from-scratch scientific NLP projects: PubMed sentence classification, citation intent classification, and ToxHabits NER."
requires-python = ">=3.10"
dependencies = [
  "iterative-stratification>=0.1.9",
  "matplotlib>=3.8.0",
  "nltk>=3.8.1",
  "numpy>=1.26.0",
  "pandas>=2.1.0",
  "scikit-learn>=1.3.0",
  "seaborn>=0.13.0",
  "spacy>=3.7.0",
  "torch>=2.2.0",
  "tqdm>=4.66.0",
]

[tool.setuptools.packages.find]
where = [
  "01_pubmed_sentence_classification/src",
  "02_citation_intent_classification/src",
  "03_toxhabits_ner_bilstm/src",
]

